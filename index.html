<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Stories by Chammana Haridas</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

  <div id="header"></div>

  <script>

    fetch("header.html")
      .then(response => response.text())
      .then(data => {

        document.getElementById("header").innerHTML = data;

      });

  </script>


  <section class="hero">

    <picture>

      <source media="(max-width:1024px)"
              srcset="images/background-mobile.png">

      <img src="images/background.png"
           alt="Stories by Chammana Haridas">

    </picture>

  </section>

</body>

</html>
