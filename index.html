<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stories by Chammana Haridas</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Header -->
  <div id="header"></div>

  <!-- Hero Section -->
  <section class="hero">

    <picture>
      <source media="(max-width: 1024px)" srcset="images/background-mobile.png">

      <img src="images/background.png"
           alt="Stories by Chammana Haridas">
    </picture>

  </section>

  <!-- Load Header + Mobile Menu -->
  <script>
    fetch("header.html")
      .then(response => response.text())
      .then(data => {

        // Insert header
        document.getElementById("header").innerHTML = data;

        // Mobile menu
        const toggle = document.querySelector(".menu-toggle");
        const nav = document.querySelector(".nav-links");
        const dropdown = document.querySelector(".dropdown");

        // Hamburger menu toggle
        if (toggle && nav) {
          toggle.addEventListener("click", () => {
            nav.classList.toggle("active");
          });
        }

        // Dropdown toggle
        if (dropdown) {
          dropdown.addEventListener("click", () => {
            dropdown.classList.toggle("active");
          });
        }

      })
      .catch(error => console.log("Header failed to load:", error));
  </script>

</body>
</html>
