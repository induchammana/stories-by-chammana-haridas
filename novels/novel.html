<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>നോവലുകൾ - Chammana Haridas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="short-page">

  <div id="header"></div>

  <script>
fetch("../header.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("header").innerHTML = data;
    const toggle = document.querySelector(".menu-toggle");
    const nav = document.querySelector(".nav-links");
    if(toggle && nav){
      toggle.addEventListener("click", function(){
        nav.classList.toggle("active");
      });
    }
  });
</script>

  <section class="page-title">
    <h1>നോവലുകൾ</h1>
  </section>
  <main class="stories-container">

    <a href="raaman/index.html"
       class="story-card">നാട്ടുവഴികൾ</a>

    <a href="chandran/index.html"
       class="story-card">ചന്ദ്രൻ</a>

  </main>


  <footer class="footer">

    <p>
      &copy; 2026 Chammana Haridas.
      All stories reserved.
    </p>

  </footer>
</body>
</html>
